    description: Ensure that canonical Johnny-Johnny stable ids are preserved across GitHub generate, pull, reconcile, and
      publish operations. The generator must never derive a new stable id from a title when an existing canonical id is available
      through Johnny-Johnny metadata.
    acceptance_criteria:
